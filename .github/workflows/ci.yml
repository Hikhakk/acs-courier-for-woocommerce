name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.0', '8.1', '8.2', '8.3', '8.4' ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Unit tests
        run: composer test

  quality:
    name: Lint and static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: WordPress coding standards
        run: composer lint

      - name: Static analysis
        run: composer analyse

  readme:
    name: Validate readme.txt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required readme headers
        run: |
          set -e
          for header in "Requires at least:" "Requires PHP:" "Stable tag:" "License:" "License URI:"; do
            grep -q "^${header}" readme.txt || { echo "readme.txt missing: ${header}"; exit 1; }
          done
          grep -q "^== External services ==" readme.txt \
            || { echo "readme.txt missing the External services disclosure"; exit 1; }
          echo "readme.txt headers present."
